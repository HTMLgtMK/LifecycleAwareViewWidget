pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url = 'https://maven.pkg.github.com/HTMLgtMK/LifecycleAwareViewWidget' }
    }
}

rootProject.name = "LifecycleAwareViewWidget"
include ':app'
include ':lifecycleaware-viewwidget'
project(":lifecycleaware-viewwidget").projectDir = file("library/lifecycleaware-viewwidget")
