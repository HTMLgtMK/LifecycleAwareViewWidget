plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

apply { from(rootProject.file("config.gradle")) }

android {
    namespace 'com.gthncz.lifecyclewidget'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.gthncz.lifecyclewidget"
        minSdk 23
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation "androidx.databinding:viewbinding:9.2.1"
    implementation project(':lifecycleaware-viewwidget')
    //  implementation 'com.gthncz:lifecycleaware-viewwidget:1.0.0'

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}